# Default values for ddos-defense Helm chart.
# This is a YAML-formatted file.

global:
  environment: production

# Scoring Service (FastAPI)
scoringService:
  enabled: true
  replicaCount: 2
  image:
    repository: ddos-defense/scoring-service
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  env:
    ddosEnv: "production"
    modelDir: "/app/models"
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5

# Ryu / OpenFlow Controller
controller:
  enabled: true
  replicaCount: 1
  image:
    repository: ddos-defense/controller
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    openflowPort: 6653
    restPort: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Reverse Proxy (Nginx)
reverseProxy:
  enabled: true
  replicaCount: 2
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ddos-defense.local
      paths:
        - path: /
          pathType: Prefix

# Authentication & Credentials (Unset by default for zero-paid-cloud subscription health)
secrets:
  apiKeys: ""        # Maps to DDOS_API_KEYS (comma-separated)
  adminKeys: ""      # Maps to DDOS_ADMIN_KEYS (comma-separated)
  openrouterApiKey: ""
  nvidiaApiKey: ""
  cloudflare:
    apiToken: ""     # Unset: operates in proposal-only mode
    accountId: ""
