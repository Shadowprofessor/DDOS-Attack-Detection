apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ddos-defense.fullname" . }}-nginx-config
  labels:
    {{- include "ddos-defense.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;
        client_max_body_size 10M;

        upstream scoring_backend {
            server {{ include "ddos-defense.fullname" . }}-scoring:8000;
            keepalive 32;
        }

        server {
            listen 80;
            server_name _;

            location /health {
                proxy_pass http://scoring_backend/health;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /ws/dashboard {
                proxy_pass http://scoring_backend/ws/dashboard;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 86400s;
            }

            location / {
                proxy_pass http://scoring_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
