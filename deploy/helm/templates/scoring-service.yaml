apiVersion: v1
kind: Service
metadata:
  name: {{ include "ddos-defense.fullname" . }}-scoring
  labels:
    {{- include "ddos-defense.labels" . | nindent 4 }}
    app.kubernetes.io/component: scoring-service
spec:
  type: {{ .Values.scoringService.service.type }}
  ports:
    - port: {{ .Values.scoringService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ddos-defense.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scoring-service
