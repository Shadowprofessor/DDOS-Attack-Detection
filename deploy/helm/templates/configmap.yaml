apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ddos-defense.fullname" . }}-config
  labels:
    {{- include "ddos-defense.labels" . | nindent 4 }}
data:
  DDOS_ENV: {{ .Values.global.environment | quote }}
  DDOS_MODEL_DIR: {{ .Values.scoringService.env.modelDir | quote }}
  DDOS_SCORING_URL: "http://{{ include "ddos-defense.fullname" . }}-scoring:8000"
