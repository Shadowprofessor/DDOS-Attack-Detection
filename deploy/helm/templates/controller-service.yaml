apiVersion: v1
kind: Service
metadata:
  name: {{ include "ddos-defense.fullname" . }}-controller
  labels:
    {{- include "ddos-defense.labels" . | nindent 4 }}
    app.kubernetes.io/component: ryu-controller
spec:
  type: {{ .Values.controller.service.type }}
  ports:
    - port: {{ .Values.controller.service.openflowPort }}
      targetPort: openflow
      protocol: TCP
      name: openflow
    - port: {{ .Values.controller.service.restPort }}
      targetPort: rest
      protocol: TCP
      name: rest
  selector:
    {{- include "ddos-defense.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ryu-controller
