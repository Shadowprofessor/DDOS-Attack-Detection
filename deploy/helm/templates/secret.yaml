apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddos-defense.fullname" . }}-secrets
  labels:
    {{- include "ddos-defense.labels" . | nindent 4 }}
type: Opaque
stringData:
  DDOS_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  DDOS_ADMIN_KEYS: {{ .Values.secrets.adminKeys | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  NVIDIA_API_KEY: {{ .Values.secrets.nvidiaApiKey | quote }}
  CLOUDFLARE_API_TOKEN: {{ .Values.secrets.cloudflare.apiToken | quote }}
  CLOUDFLARE_ACCOUNT_ID: {{ .Values.secrets.cloudflare.accountId | quote }}
