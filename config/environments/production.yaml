# DDoS Attack Detection & Mitigation System
# Environment: Production
environment: production

capture_backend:
  type: "ebpf"
  interface: "${CAPTURE_INTERFACE:-eth0}"
  ebpf:
    fallback_to_skb: true
    deployment_mode: "${EBPF_DEPLOYMENT_MODE:-host_ingress}"

models:
  hierarchical:
    model_dir: "${DDOS_MODEL_DIR:-models}"
  ensemble:
    rf_path: "${DDOS_RF_PATH:-models/cicddos2019_rf.pkl}"
    xgb_path: "${DDOS_XGB_PATH:-models/cicddos2019_xgboost.pkl}"
    sequence_classifier_path: "${DDOS_SEQ_PATH:-models/sequence_classifier_best.pt}"
    ensemble_bundle_path: "${DDOS_ENSEMBLE_BUNDLE:-models/ensemble_weights.joblib}"

scoring_service:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  model_dir: "models"
  log_level: "info"
  rate_limit:
    window_seconds: 60
    max_requests: 120
    max_batch_size: 1000
  auth:
    api_keys: "${DDOS_API_KEYS:-}"
    admin_keys: "${DDOS_ADMIN_KEYS:-}"

controller:
  host: "0.0.0.0"
  openflow_port: 6653
  rest_port: 8080
  poll_interval: 5
  log_level: "info"

reverse_proxy:
  port: 80
  client_max_body_size: "10M"
  timeout_seconds: 60

cloud_providers:
  cloudflare:
    api_token: "${CLOUDFLARE_API_TOKEN:-}"
    account_id: "${CLOUDFLARE_ACCOUNT_ID:-}"

llm:
  endpoint: "${OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}"
  model: "${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}"
  openrouter_api_key: "${OPENROUTER_API_KEY:-}"
  nvidia_api_key: "${NVIDIA_API_KEY:-}"

# Layer-3 Nemotron threat analyst (M2). Env vars override these (DDOS_LLM_*, NVIDIA_API_KEY).
analyst:
  base_url: "${DDOS_LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}"
  # Fallback chain, tried in order; unavailable models fall through to the rule-based summary.
  models: "${DDOS_LLM_MODELS:-nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-3-super-120b-a12b}"
  timeout_s: "${DDOS_LLM_TIMEOUT:-90}"
  enable_thinking: "${DDOS_LLM_ENABLE_THINKING:-false}"
  max_tokens: "${DDOS_LLM_MAX_TOKENS:-1500}"
  hash_ips: "${DDOS_LLM_HASH_IPS:-false}"
  price_in_per_1m: "${DDOS_LLM_PRICE_IN_PER_1M:-0}"
  price_out_per_1m: "${DDOS_LLM_PRICE_OUT_PER_1M:-0}"
