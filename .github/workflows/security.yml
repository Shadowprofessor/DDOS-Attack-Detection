name: Security Scans

on:
  push:
    branches: [main, 'feat/*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action v2 reads PR commits on pull_request events
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required by v2 to scan pull requests
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  bandit:
    name: Static analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install bandit
      # Fail only on medium+ severity AND medium+ confidence findings.
      - run: bandit -r src --severity-level medium --confidence-level medium

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: surfaces CVEs without blocking the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --desc

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py requirements requirements.txt -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  citations:
    name: Citation check (REPORT, README, GRC docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install requests==2.34.2
      - run: python scripts/check_citations.py
