name: Test Suite & Mitigation Security Gate

on:
  push:
    branches:
      - main
      - 'feat/*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest & Security Audits
    runs-on: ubuntu-latest
    env:
      # Model/data artifacts are gitignored; CI runs against the DummyClassifier
      # fallback and skips artifact-dependent tests with a clear reason.
      CI: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Security Check: Mitigation Approval Gate & Bypass Audit"
        id: mitigation-safety-gate
        run: |
          python -m pytest tests/test_mitigation_bypass.py tests/test_mitigation_approval_gate.py -v

      - name: Full Test Suite
        run: |
          python -m pytest tests/ -v
